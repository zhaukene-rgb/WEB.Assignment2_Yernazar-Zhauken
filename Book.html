<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Place Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/Book.css">
</head>
<body>
    <div class="all">
        <header class="Enjoyit container pt-4">
            <span class="Enjoyit">Enjoyit</span>
        </header>
        <main class="book-container container my-4">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="container p-0">
                        <div class="one-info">
                            <p class="spec-font">Address</p>
                            <p class="spec-font-2">Kazbek bi 41/1</p>
                        </div>
                        <div class="two-info">
                            <hr class="separator-line">
                            <p class="spec-font">Hours</p>
                            <p class="spec-font-2">Mon-Fri; 7:00-18:00</p>
                            <p class="spec-font-2">Sat-Sun; 8:00-17:00</p>
                        </div>
                        <div class="two-info">
                            <hr class="separator-line">
                            <p class="spec-font">Contact</p>
                            <p class="spec-font-2">zhaukene@gmail.com</p>
                            <p class="spec-font-2">87753554719</p>
                        </div>
                        <div class="box">
                            <div class="date--info">
                                <p>Date reservations</p>
                            </div>
                            <div class="informate">
                                <div class="customer-name mb-3">
                                    <input type="text" placeholder="Your name" class="custom-input w-100">
                                </div>
                                <div class="Table mb-3">
                                    <input type="text" placeholder="Reservations for table" class="custom-input w-100">
                                </div>
                            </div>
                            <div class="date mb-3">
                                <input type="datetime-local" class="custom-datetime w-100">
                            </div>
                            <button class="btn w-100">
                                <p id="btnText" class="m-0">Request table</p>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div class="plan text-center my-4">
        <img src="img/plan.png" alt="Enjoyit coffee plan" class="img-fluid" style="max-width: 400px;">
    </div>
    <footer class="container text-center pb-4">
        <p>&copy; 2026 Enjoyit Coffee.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
