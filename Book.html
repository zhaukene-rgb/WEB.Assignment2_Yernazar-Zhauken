<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
    <head>
        <title>Place Order</title>
        <link rel ="stylesheet" href="css/Book.css">
    </head>
    <script src="js/Book.js" defer></script>
    <body>
        <div class="all">
            <header class="Enjoyit">
                <span class="Enjoyit">Enjoyit</span>
            </header>
            
            <main class="book-container">
                    <div class="container">
                            <div class="one-info">
                                <p class="spec-font">Address</p>
                                <p class="spec-font-2">Kazbek bi 41/1</p>
                            </div>
                            <div class="two-info">
                                <hr class="separator-line">
                                <p class="spec-font">Hours</p>
                                <p class="spec-font-2">Mon-Fri; 7:00-18:00</p>
                                <p class="spec-font-2">Sat-Sun; 8:00-17:00</p>
                            </div>
                            <div class="two-info">
                                <hr class="separator-line">
                                <p class="spec-font">Contact</p>
                                <p class="spec-font-2">zhaukene@gmail.com</p>
                                <p class="spec-font-2">87753554719</p>
                            </div>
                        <div class="box">
                            <div class="date--info">
                                    <p>Date reservations</p>
                                </div>
                              <div class="informate">
                                <div class="customer-name">
                                    <input type="text" placeholder="Your name" class="custom-input">
                                </div>
                                <div class="Table">
                                    <input type="text" placeholder="Reservations for table" class="customer-input">
                                </div>
                              </div>               
                                <div class="date">
                                    <input type="datetime-local" class="custom-datetime">
                                </div> 
                                <button class="btn" onclick="changeText()">
                                    <p id="btnText">Request table</p>
                                </button>
                                
                        </div>
                    </div>
            </main>
        </div>
        <div class="plan">
            <img src="img/plan.png" alt="Enjoyit coffee plan">
        </div>
        <footer class="container">
                    <p>&copy; 2026 Enjoyit Coffee.By Yernazar Zhauken</p>
            </footer>
    </body>
</html>
